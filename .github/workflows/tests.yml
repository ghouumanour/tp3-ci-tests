
name: Run Tests

on:
  push:
    branches: [ main ]

jobs:
  test-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore dotnet-app/ProjectFile.csproj
          dotnet restore dotnet-app.Tests/ProjectFile-Tests.csproj

      
      - name: Run .NET tests
        run: dotnet test dotnet-app.Tests/ProjectFile-Tests.csproj --logger "console;verbosity=detailed" --logger "trx;LogFileName=TestResults.trx"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-report
          path: dotnet-app.Tests/TestResults/TestResults.trx
          if-no-files-found: warn

  
  
      - name: Run Python Tests and Generate XML Report
        run: |
          cd python-app
          python -m pip install unittest-xml-reporting
          python test_math_utils.py

      - name: Upload Python Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report
          path: python-app/test-reports
          if-no-files-found: warn

